[project]
name = "hexlet-code"
version = "0.1.0"
description = "ИИ-генератор карточки товара: документы поставщика → проверяемая карточка"
requires-python = ">=3.12"
dependencies = [
    "openai-agents>=0.2,<1",
    "openai>=1.50",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary,pool]>=3.2",
    "temporalio>=1.14,<2",
    "structlog>=24.1",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "fastembed>=0.4",
    "pdfplumber>=0.11",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
]
